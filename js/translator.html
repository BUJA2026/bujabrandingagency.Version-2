<!--
  BUJA Branding Agency — Language Switcher / Translator
  =======================================================
  Self-contained snippet. Paste this entire block just before
  the closing </body> tag on any page (index.html, service.html,
  payment.html, etc.).

  How it works:
  - Small gold circular button (bottom-right) opens a language menu.
  - Selecting a language sets the "googtrans" cookie that Google
    Translate's own script reads on page load, then reloads the page.
    This is more reliable than trying to manipulate Google's hidden
    widget after the page has already loaded.
  - Google Translate's own UI (banner, dropdown, tooltips) is hidden
    via CSS. Only this custom button/menu is visible.

  To add more languages: add another <a data-lang="xx">Name</a> line
  in the menu below, AND add "xx" to includedLanguages in the script.
  Use standard Google Translate language codes (sw, fr, de, es, zh-CN, etc.)
-->

<style>
  /* ---------- Language switcher UI ---------- */
  .lang-switch {
    position: fixed;
    bottom: 92px; /* sits above the WhatsApp float button if present */
    right: 20px;
    z-index: 998;
  }
  .lang-switch-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #c8a14a;
    color: #0f0b67;
    border: none;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 3px 14px rgba(200, 161, 74, 0.45);
    transition: transform 0.18s ease;
  }
  .lang-switch-btn:hover { transform: scale(1.08); }
  .lang-switch-menu {
    position: absolute;
    bottom: 46px;
    right: 0;
    background: #211c85;
    border: 1px solid rgba(217, 214, 212, 0.2);
    border-radius: 8px;
    padding: 6px;
    min-width: 160px;
    display: none;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  }
  .lang-switch-menu.open { display: flex; }
  .lang-switch-menu a {
    display: block;
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 0.78rem;
    color: #d9d6d4;
    font-weight: 600;
    transition: background 0.15s, color 0.15s;
    cursor: pointer;
  }
  .lang-switch-menu a:hover { background: rgba(200, 161, 74, 0.16); color: #c8a14a; }
  @media (max-width: 640px) {
    .lang-switch { bottom: 84px; right: 16px; }
  }

  /* ---------- Hide Google's own widget UI entirely ---------- */
  #google_translate_element { position: absolute; top: -9999px; left: -9999px; height: 0; overflow: hidden; }
  .goog-te-banner-frame, .goog-te-balloon-frame { display: none !important; }
  body { top: 0 !important; position: static !important; }
  .goog-tooltip, .goog-tooltip:hover { display: none !important; }
  .goog-text-highlight { background: none !important; box-shadow: none !important; }
</style>

<!-- Language Switcher (custom UI, powered by the real Google Translate engine) -->
<div class="lang-switch" id="langSwitch">
  <button class="lang-switch-btn" id="langSwitchBtn" aria-label="Change language" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
  </button>
  <div class="lang-switch-menu" id="langSwitchMenu" role="menu">
    <a data-lang="en" role="menuitem">English</a>
    <a data-lang="sw" role="menuitem">Kiswahili</a>
    <a data-lang="fr" role="menuitem">Français</a>
    <a data-lang="de" role="menuitem">Deutsch</a>
    <a data-lang="es" role="menuitem">Español</a>
    <a data-lang="zh-CN" role="menuitem">中文</a>
  </div>
</div>

<!-- Hidden Google Translate engine — the button/menu above is the only visible control -->
<div id="google_translate_element"></div>

<script>
  // Initializes the real Google Translate engine (its own UI stays hidden via CSS above)
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,sw,fr,de,es,zh-CN',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
      autoDisplay: false
    }, 'google_translate_element');
  }

  (function () {
    const btn = document.getElementById('langSwitchBtn');
    const menu = document.getElementById('langSwitchMenu');

    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      const isOpen = menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    document.addEventListener('click', function (e) {
      if (!menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }
    });

    function setGoogTransCookie(lang) {
      const hostname = window.location.hostname;
      const value = (lang === 'en') ? '' : ('/en/' + lang);

      // Clear first (all path/domain variants) to avoid stale cookie conflicts
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=' + hostname + ';';
      document.cookie = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=.' + hostname + ';';

      if (value) {
        document.cookie = 'googtrans=' + value + '; path=/;';
        document.cookie = 'googtrans=' + value + '; path=/; domain=' + hostname + ';';
      }
    }

    function selectLanguage(lang) {
      // Cookie + reload is the method Google Translate's own script reads
      // on page load, so it works reliably regardless of widget render timing.
      setGoogTransCookie(lang);
      window.location.reload();
    }

    menu.querySelectorAll('a[data-lang]').forEach(function (link) {
      link.addEventListener('click', function () {
        selectLanguage(link.getAttribute('data-lang'));
        menu.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
